[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ironlab"
version = "0.1.0"
description = "공유 GPU 서버용 사용자 워크스페이스·GPU 작업 큐·모니터링·파일 관리 도구"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"   # tomllib
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    "docker>=7.0",
    "nvidia-ml-py>=12.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Hong-Iron/ironlab"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ironlab = "ironlab.cli:main"
ironlab-server = "ironlab.server:main"

[tool.setuptools]
packages = ["ironlab"]

[tool.setuptools.package-data]
ironlab = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
